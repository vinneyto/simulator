[project]
name = "simulator"
version = "0.3.0"
description = "Async backend for 3DGS simulator scenes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "fastapi>=0.116,<1",
    "numpy>=2.0,<3",
    "pydantic-settings>=2.10,<3",
    "scalar-fastapi>=1.4,<2",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[project.scripts]
simulator = "simulator.main:run"
openapi-export = "simulator.export_openapi:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulator"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
